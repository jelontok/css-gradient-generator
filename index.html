<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-preview {
            transition: background 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">CSS Gradient Generator</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Controls Panel -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-semibold text-gray-700 mb-6">Controls</h2>
                
                <!-- Gradient Type -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Gradient Type</label>
                    <select id="gradientType" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="linear">Linear</option>
                        <option value="radial">Radial</option>
                    </select>
                </div>
                
                <!-- Direction (for linear) -->
                <div id="directionContainer" class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Direction</label>
                    <select id="direction" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="to right">To Right</option>
                        <option value="to left">To Left</option>
                        <option value="to bottom">To Bottom</option>
                        <option value="to top">To Top</option>
                        <option value="to bottom right">To Bottom Right</option>
                        <option value="to bottom left">To Bottom Left</option>
                        <option value="to top right">To Top Right</option>
                        <option value="to top left">To Top Left</option>
                        <option value="45deg">45°</option>
                        <option value="90deg">90°</option>
                        <option value="135deg">135°</option>
                        <option value="180deg">180°</option>
                        <option value="225deg">225°</option>
                        <option value="270deg">270°</option>
                        <option value="315deg">315°</option>
                        <option value="360deg">360°</option>
                    </select>
                </div>
                
                <!-- Color Stops -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Colors</label>
                    <div id="colorStops">
                        <div class="color-stop flex items-center mb-3">
                            <input type="color" value="#ff0000" class="color-input w-12 h-12 rounded border-2 border-gray-300 cursor-pointer">
                            <div class="flex-1 mx-3">
                                <div class="text-xs text-gray-500 mb-1">Position</div>
                                <input type="range" min="0" max="100" value="0" class="position-slider w-full mb-1">
                                <div class="text-xs text-gray-500 mb-1">Opacity</div>
                                <input type="range" min="0" max="100" value="100" class="opacity-slider w-full">
                            </div>
                            <div class="w-16 text-sm text-gray-600">
                                <div class="position-display">0%</div>
                                <div class="opacity-display text-xs">100%</div>
                            </div>
                            <button class="remove-color ml-2 px-2 py-1 bg-red-500 text-white text-xs rounded hover:bg-red-600 disabled:opacity-50" disabled>×</button>
                        </div>
                        <div class="color-stop flex items-center mb-3">
                            <input type="color" value="#0000ff" class="color-input w-12 h-12 rounded border-2 border-gray-300 cursor-pointer">
                            <div class="flex-1 mx-3">
                                <div class="text-xs text-gray-500 mb-1">Position</div>
                                <input type="range" min="0" max="100" value="100" class="position-slider w-full mb-1">
                                <div class="text-xs text-gray-500 mb-1">Opacity</div>
                                <input type="range" min="0" max="100" value="100" class="opacity-slider w-full">
                            </div>
                            <div class="w-16 text-sm text-gray-600">
                                <div class="position-display">100%</div>
                                <div class="opacity-display text-xs">100%</div>
                            </div>
                            <button class="remove-color ml-2 px-2 py-1 bg-red-500 text-white text-xs rounded hover:bg-red-600">×</button>
                        </div>
                    </div>
                    <button id="addColor" class="mt-2 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors">Add Color</button>
                </div>
                
                <!-- CSS Output -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">CSS Code</label>
                    <div class="relative">
                        <textarea id="cssOutput" class="w-full h-24 p-3 border border-gray-300 rounded-md font-mono text-sm bg-gray-50" readonly></textarea>
                        <button id="copyBtn" class="absolute top-2 right-2 px-3 py-1 bg-gray-700 text-white text-xs rounded hover:bg-gray-800 transition-colors">Copy</button>
                    </div>
                </div>
            </div>
            
            <!-- Preview Panel -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-semibold text-gray-700 mb-6">Preview</h2>
                <div id="gradientPreview" class="gradient-preview w-full h-80 rounded-lg border-2 border-gray-300" style="background: linear-gradient(to right, #ff0000 0%, #0000ff 100%);"></div>
                
                <!-- Preset Gradients -->
                <div class="mt-6">
                    <h3 class="text-lg font-medium text-gray-700 mb-3">Quick Presets</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="preset-btn h-12 rounded border-2 border-gray-300 hover:border-blue-500 transition-colors" data-gradient="linear-gradient(45deg, #ff6b6b, #4ecdc4)" style="background: linear-gradient(45deg, #ff6b6b, #4ecdc4);"></button>
                        <button class="preset-btn h-12 rounded border-2 border-gray-300 hover:border-blue-500 transition-colors" data-gradient="linear-gradient(135deg, #667eea, #764ba2)" style="background: linear-gradient(135deg, #667eea, #764ba2);"></button>
                        <button class="preset-btn h-12 rounded border-2 border-gray-300 hover:border-blue-500 transition-colors" data-gradient="linear-gradient(to right, #ffecd2, #fcb69f)" style="background: linear-gradient(to right, #ffecd2, #fcb69f);"></button>
                        <button class="preset-btn h-12 rounded border-2 border-gray-300 hover:border-blue-500 transition-colors" data-gradient="radial-gradient(circle, #ff9a9e, #fecfef)" style="background: radial-gradient(circle, #ff9a9e, #fecfef);"></button>
                        <button class="preset-btn h-12 rounded border-2 border-gray-300 hover:border-blue-500 transition-colors" data-gradient="linear-gradient(45deg, #a8edea, #fed6e3)" style="background: linear-gradient(45deg, #a8edea, #fed6e3);"></button>
                        <button class="preset-btn h-12 rounded border-2 border-gray-300 hover:border-blue-500 transition-colors" data-gradient="linear-gradient(to top, #0ba360, #3cba92)" style="background: linear-gradient(to top, #0ba360, #3cba92);"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
